<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Markets — Cryptocurrency Club</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="coins.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="nav-container">
        <a href="../index.html" class="brand-logo">⚡ CryptoClub</a>
        <nav>
          <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="coins.html" class="active">Markets</a></li>
            <li>
              <a href="../investment/investment.html">Investment & Portfolio</a>
            </li>
            <li><a href="../news/news.html">News & Sentiment</a></li>
            <li><a href="../membership/membership.html">VIP Membership</a></li>
          </ul>
        </nav>
        <div class="nav-actions">
          <button class="icon-btn theme-toggle-btn">☀️</button>
        </div>
      </div>
      <div id="ticker-mount"></div>
    </header>

    <main>
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
          flex-wrap: wrap;
          gap: 1rem;
        "
      >
        <h1>Live Cryptocurrency Markets</h1>
        <div style="display: flex; gap: 0.75rem; align-items: center">
          <label for="coin-search" class="sr-only">Search coin</label>
          <input
            type="text"
            id="coin-search"
            aria-label="Search coin"
            placeholder="Search coin (e.g. BTC, Solana)..."
            style="min-width: 260px"
          />
          <button id="refresh-btn" class="icon-btn">🔄 Refresh</button>
        </div>
      </div>

      <!-- Filter Pills -->
      <div
        class="filter-bar"
        style="
          display: flex;
          gap: 0.5rem;
          margin-bottom: 1.5rem;
          flex-wrap: wrap;
        "
      >
        <button class="filter-pill active" data-filter="all">All Coins</button>
        <button class="filter-pill" data-filter="favorites">
          ⭐ Watchlist
        </button>
        <button class="filter-pill" data-filter="gainers">
          🚀 Top Gainers
        </button>
        <button class="filter-pill" data-filter="losers">📉 Top Losers</button>
      </div>

      <!-- Market Table -->
      <div class="table-responsive">
        <table class="market-table">
          <thead>
            <tr>
              <th scope="col" aria-label="Watchlist" style="width: 40px">
                <span class="sr-only">Watchlist</span>
              </th>
              <th scope="col" data-sort="symbol">Asset ⬍</th>
              <th scope="col" data-sort="price">Price ⬍</th>
              <th scope="col" data-sort="change">24h Change ⬍</th>
              <th scope="col">24h Range</th>
              <th scope="col" data-sort="market_cap">Market Cap ⬍</th>
              <th scope="col">7d Trend</th>
            </tr>
          </thead>
          <tbody id="market-table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </main>

    <script type="module" src="coins.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Cryptocurrency Club — Onboarding Wizard</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="registration.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="nav-container">
        <a href="../index.html" class="brand-logo">⚡ CryptoClub</a>
        <nav>
          <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../coins/coins.html">Markets</a></li>
            <li><a href="../investment/investment.html">Investment</a></li>
            <li><a href="../membership/membership.html">VIP Membership</a></li>
          </ul>
        </nav>
        <div class="nav-actions">
          <button class="icon-btn theme-toggle-btn">☀️</button>
        </div>
      </div>
    </header>

    <main style="max-width: 680px">
      <div class="crypto-card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
          "
        >
          <span
            id="step-indicator"
            style="font-weight: 700; color: var(--accent-cyan)"
            >Step 1 of 3: Account Profile</span
          >
        </div>

        <form id="wizard-form">
          <!-- STEP 1: Personal Info -->
          <div class="wizard-step" id="step-1">
            <h2>Create Investor Profile</h2>
            <div style="margin-bottom: 1rem">
              <label
                for="reg-name"
                style="display: block; margin-bottom: 0.4rem"
                >Full Name</label
              >
              <input
                type="text"
                id="reg-name"
                name="name"
                required
                placeholder="Alex Mercer"
                style="width: 100%"
              />
            </div>
            <div style="margin-bottom: 1rem">
              <label
                for="reg-email"
                style="display: block; margin-bottom: 0.4rem"
                >Email Address</label
              >
              <input
                type="email"
                id="reg-email"
                name="email"
                required
                placeholder="alex@domain.com"
                style="width: 100%"
              />
            </div>
            <div style="margin-bottom: 1.5rem">
              <label
                for="reg-experience"
                style="display: block; margin-bottom: 0.4rem"
                >Trading Background</label
              >
              <select id="reg-experience" name="experience" style="width: 100%">
                <option value="beginner">Beginner (0 - 1 Year)</option>
                <option value="intermediate">Intermediate (1 - 3 Years)</option>
                <option value="advanced">Advanced Trader / Analyst</option>
              </select>
            </div>
          </div>

          <!-- STEP 2: Risk Tolerance Questionnaire -->
          <div class="wizard-step" id="step-2" style="display: none">
            <h2>Investor Risk Profile Assessment</h2>
            <p
              style="
                color: var(--text-secondary);
                margin-bottom: 1rem;
                font-size: 0.95rem;
              "
            >
              How do you react if your crypto portfolio drops 20% in a single
              week?
            </p>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                margin-bottom: 1.5rem;
              "
            >
              <label class="option-card">
                <input type="radio" name="risk_q1" value="1" required checked />
                Panic and sell immediately (Conservative)
              </label>
              <label class="option-card">
                <input type="radio" name="risk_q1" value="2" /> Hold and wait
                for recovery (Balanced)
              </label>
              <label class="option-card">
                <input type="radio" name="risk_q1" value="3" /> Buy the dip
                aggressively (Aggressive Growth)
              </label>
            </div>
          </div>

          <!-- STEP 3: Membership Selection -->
          <div class="wizard-step" id="step-3" style="display: none">
            <h2>Select Membership Tier</h2>
            <div
              style="
                background: var(--accent-green-bg);
                color: var(--accent-green);
                padding: 0.75rem 1rem;
                border-radius: var(--radius-sm);
                margin-bottom: 1rem;
                font-weight: 600;
              "
            >
              ✓ Recommended for you: Pro Trader Tier
            </div>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                margin-bottom: 1.5rem;
              "
            >
              <label class="option-card">
                <input
                  type="radio"
                  name="tier_choice"
                  value="Starter"
                  checked
                />
                <div>
                  <strong>Starter Member</strong> (Free — Community signals)
                </div>
              </label>
              <label class="option-card">
                <input type="radio" name="tier_choice" value="Pro" />
                <div>
                  <strong>Pro Trader</strong> ($99/mo — DCA & Swing Strategies)
                </div>
              </label>
              <label class="option-card">
                <input type="radio" name="tier_choice" value="VIP" />
                <div>
                  <strong>VIP Institutional</strong> ($159/mo — 1-on-1
                  Mentorship)
                </div>
              </label>
            </div>
          </div>

          <!-- Wizard Navigation Buttons -->
          <div
            style="
              display: flex;
              justify-content: space-between;
              border-top: 1px solid var(--border-color);
              padding-top: 1.25rem;
            "
          >
            <button
              type="button"
              id="prev-btn"
              class="icon-btn"
              style="display: none"
            >
              ← Back
            </button>
            <button
              type="button"
              id="next-btn"
              class="btn-primary"
              style="margin-left: auto"
            >
              Continue →
            </button>
          </div>
        </form>
      </div>
    </main>

    <script type="module" src="registration.js"></script>
  </body>
</html>

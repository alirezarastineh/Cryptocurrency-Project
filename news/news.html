<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News & Sentiment Intelligence — Cryptocurrency Club</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="news.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="nav-container">
        <a href="../index.html" class="brand-logo">⚡ CryptoClub</a>
        <nav>
          <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../coins/coins.html">Markets</a></li>
            <li>
              <a href="../investment/investment.html">Investment & Portfolio</a>
            </li>
            <li><a href="news.html" class="active">News & Sentiment</a></li>
            <li><a href="../membership/membership.html">VIP Membership</a></li>
          </ul>
        </nav>
        <div class="nav-actions">
          <button class="icon-btn theme-toggle-btn">☀️</button>
        </div>
      </div>
      <div id="ticker-mount"></div>
    </header>

    <main>
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
          flex-wrap: wrap;
          gap: 1rem;
        "
      >
        <h1>Market News & Sentiment</h1>
        <div>
          <label for="news-search" class="sr-only">Search headlines</label>
          <input
            type="text"
            id="news-search"
            name="news-search"
            aria-label="Search headlines"
            placeholder="Search headlines..."
            style="min-width: 250px"
          />
        </div>
      </div>

      <!-- Category Tabs -->
      <div
        class="category-bar"
        style="display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap"
      >
        <button class="filter-pill active" data-cat="ALL">All News</button>
        <button class="filter-pill" data-cat="BTC">Bitcoin</button>
        <button class="filter-pill" data-cat="ETH">Ethereum & DeFi</button>
        <button class="filter-pill" data-cat="REGULATION">Regulation</button>
        <button class="filter-pill" data-cat="BOOKMARKS">
          🔖 Saved Articles
        </button>
      </div>

      <!-- News Grid Container -->
      <div id="news-grid" class="news-grid">
        <div style="color: var(--text-muted)">
          Loading latest market intelligence...
        </div>
      </div>
    </main>

    <script type="module" src="news.js"></script>
  </body>
</html>
